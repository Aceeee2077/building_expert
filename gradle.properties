# 这里指向项目内自带的 Temurin JDK 21（.tools/jdk-21，已在 .gitignore 中排除）。
org.gradle.java.home=D:/Github/building_expert/.tools/jdk-21

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14
fabric_version=0.92.6+1.20.1

mod_version=1.0.0
maven_group=com.example.buildingalbum
